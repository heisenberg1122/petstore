server:
  port: ${PORT:8082}

spring:
  application:
    name: mypetstore
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:mypetstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:uploads}
  admin:
    login-url: ${APP_ADMIN_LOGIN_URL:http://localhost:5173/admin/login}
