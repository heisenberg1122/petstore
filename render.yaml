services:
  - type: web
    name: mypetstore-api
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn -q -DskipTests package
    startCommand: java -jar target/mypetstore-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: mypetstore-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mypetstore-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mypetstore-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGIN
        value: "*"

  - type: static
    name: mypetstore-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mypetstore-db
    plan: free
    databaseName: mypetstore
    user: mypetstore
